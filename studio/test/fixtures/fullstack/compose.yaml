services:
  redis:
    image: redis:7.4.6-alpine
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'always']
    ports:
      - '127.0.0.1:${REDIS_PORT:?Studio assigns REDIS_PORT}:6379'
    volumes:
      - data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 1s
      retries: 30
volumes:
  data:
