# `cargo gallery [ARGS...]` opens the component gallery; arguments after it
# reach the gallery, as in `cargo gallery --component chat --scenario answer`.
[alias]
gallery = "run --quiet --locked --features gallery --bin tui-gallery --"

# Cargo, not rustc's `-D warnings`, fails every command on warnings: rustc
# keeps no incremental results from a compilation that ends in errors, so
# `-D warnings` turns each failing lint run into a full recheck of the crate.
# The parallel front end checks each crate on up to eight threads.
[build]
warnings = "deny"
rustflags = ["-Zthreads=8"]
