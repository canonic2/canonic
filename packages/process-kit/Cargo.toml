[package]
name = "canonic-process-kit"
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
publish = false
license-file = "LICENSE"
description = "Per-user background process lifetime, local IPC and detached startup"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
getrandom = "0.4"
semver = "1.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["user", "socket", "process", "fs", "poll", "signal"] }

[target.'cfg(windows)'.dependencies]
uds_windows = "1.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3.0"

[target.'cfg(windows)'.dev-dependencies]
# Console events and kill-on-close jobs for the detached-start fixtures.
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_JobObjects"] }

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
mod_module_files = "warn"

[profile.dev]
debug = false
