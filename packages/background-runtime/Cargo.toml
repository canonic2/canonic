[package]
name = "canonic-background-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license-file = "LICENSE"
description = "Per-user background process lifetime, local IPC and detached startup"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
getrandom = "0.4"
semver = "1.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["user", "socket", "process", "fs", "poll", "signal"] }

[target.'cfg(windows)'.dependencies]
uds_windows = "1.2"

[dev-dependencies]
tempfile = "3.0"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
mod_module_files = "warn"

[profile.dev]
debug = false
