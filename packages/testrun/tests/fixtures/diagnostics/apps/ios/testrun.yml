version: 1
builds:
  ios-debug:
    builder: xcode
    platform: ios
    target_kind: simulator
    xcode:
      project: AcmeDiagnostics.xcodeproj
      scheme: AcmeDiagnostics
      configuration: Debug
  ios-release:
    builder: xcode
    platform: ios
    target_kind: simulator
    xcode:
      project: AcmeDiagnostics.xcodeproj
      scheme: AcmeDiagnostics
      configuration: Release
