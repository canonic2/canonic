[package]
name = "canonic-registry"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license-file = "../../LICENSE"
description = "Signed pack catalogs, verified acquisition and dependency resolution"

[features]
default = []
# Owned TLS server, fixture CA and catalog signing for consumers' tests.
test-support = ["dep:rustls"]

[dependencies]
ring = "0.17.14"
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ureq = { version = "~3.3.0", default-features = false, features = ["rustls"] }
# Only the owned test server uses rustls directly; ureq brings the same version.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"], optional = true }

[target.'cfg(unix)'.dependencies]
# Non-blocking opens, so a FIFO in place of a file cannot hang a read.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Safe `fsync` for durable writes; std's sync_all issues F_FULLFSYNC there.
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
assert_fs = "1.1"
insta = { version = "1.49", features = ["json"] }
predicates = "3.1"
proptest = { version = "1.11", default-features = false, features = ["std"] }

[[test]]
name = "integration"
path = "tests/integration/main.rs"
required-features = ["test-support"]

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.rustdoc]
# Doc comments must link to items that exist.
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
mod_module_files = "warn"

# Without debug info, macOS builds keep no per-unit object files in deps/.
# Kept objects pile up with every edit, and a crowded deps/ slows every test
# process launch.
[profile.dev]
debug = false
