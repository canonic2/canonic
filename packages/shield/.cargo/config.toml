# Test processes, and every Git fixture command they start, read
# tests/git/config as Git's global configuration instead of the developer's,
# which turns off Git's automatic background maintenance in fixture
# repositories. Shield's own Git launches clear the environment and set these
# settings on their command line.
[env]
GIT_CONFIG_GLOBAL = { value = "tests/git/config", relative = true, force = true }

[alias]
# An explicit target keeps the static CRT flags off host build scripts and
# procedural macros, even when the build host is Windows AMD64 itself.
build-windows = ["build", "--release", "--locked", "--target", "x86_64-pc-windows-msvc", "--config", ".cargo/windows-release.toml"]
build-windows-arm64 = ["build", "--release", "--locked", "--target", "aarch64-pc-windows-msvc", "--config", ".cargo/windows-release.toml"]
build-linux-x64 = ["build", "--release", "--locked", "--target", "x86_64-unknown-linux-gnu"]
build-linux-arm64 = ["build", "--release", "--locked", "--target", "aarch64-unknown-linux-gnu"]
