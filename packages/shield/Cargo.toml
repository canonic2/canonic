[package]
name = "canonic-shield"
version = "0.50.2"
edition = "2024"
rust-version = "1.102"
publish = false
license-file = "../../LICENSE"
description = "Standalone AI-agent protection CLI"

# Shield is the workspace root; xtask holds the development tasks run as
# `cargo xtask <task>`. Commands in this folder still select Shield alone.
[workspace]
members = ["xtask"]

[lib]
name = "shield"

[[bin]]
name = "shield"
path = "src/main.rs"

# Without debug info, macOS builds keep no per-unit object files in deps/.
# Kept objects pile up with every edit, and a crowded deps/ slows every test
# process launch. Use the diagnostic profile for a debugger.
[profile.dev]
debug = false
# Generic code from dependencies, such as JSON encoding and parsing, is compiled
# into this crate, so unoptimized it dominated CPU-bound tests. Level 1 halves
# the suite and keeps debug assertions and overflow checks; incremental rebuilds
# stay about as quick, and only a clean build of this crate takes longer.
opt-level = 1

# Parsing, hashing and regex work in dependencies dominates the budget and
# large-policy tests; they change rarely, so optimizing them costs little.
[profile.dev.package."*"]
opt-level = 2

# Native hosts impose short hook deadlines. Keep release optimization and add
# symbols and debug assertions for diagnostics.
[profile.diagnostic]
inherits = "release"
debug = 2
debug-assertions = true
strip = "none"

[dependencies]
canonic-tui-kit = { version = "0.6.0", path = "../tui-kit" }
canonic-registry-kit = { version = "0.7.0", path = "../registry-kit" }
canonic-mcp-kit = { version = "0.27.0", path = "../mcp-kit" }
blake3 = "1.8.2"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize", "serialize"] }
# serde-saphyr's parser, used directly for the source spans of policy file edits.
granit-parser = { version = "1.3", default-features = false, features = ["std"] }
semver = "1.0"
globset = "0.4.20"
graphql-parser = "0.4.1"
regex-automata = "0.4.18"
url = "2.5.8"
# Offline site boundaries for reusable web permission drafts.
psl = "=2.1.250"
ring = "0.17.14"
thiserror = "2.0"
# Enforce the patched TLS provider floor for registry acquisition.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
toml_edit = "0.25"

[build-dependencies]
canonic-mcp-kit = { version = "0.27.0", path = "../mcp-kit", features = ["docs-build"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
rustix = { version = "1.1.6", features = ["process", "termios", "fs", "time"] }
nix = { version = "0.31", features = ["fs", "signal", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
object = { version = "0.39.1", default-features = false, features = ["read_core", "elf", "std"] }

[target.'cfg(windows)'.dependencies]
atomicwrites = "0.4.4"
ctrlc = "3.5.2"
# UTF-16 encoded PowerShell launch commands keep project paths literal.
base64 = "0.22.1"
win32job = "2.0.3"
# Suspend before assigning owned Jobs, then resume through a safe stable API.
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "job-object", "creation-flags"] }
object = { version = "0.39.1", default-features = false, features = ["read_core", "pe", "std"] }
# Safe handle-based file identity on stable Rust.
winapi-util = "0.1.11"
windows-permissions = "0.2.4"
winsafe = { version = "0.0.29", features = ["advapi"] }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14.11"

[dev-dependencies]
# Exercise the Windows PE contract on every development host.
object = { version = "0.39.1", default-features = false, features = ["read_core", "pe", "elf", "std"] }
base64 = "0.22.1"
canonic-registry-kit = { version = "0.7.0", path = "../registry-kit", features = ["test-support"] }
# Builds fixture documentation bundles for the bundled-docs integration tests.
canonic-mcp-kit = { version = "0.27.0", path = "../mcp-kit", features = ["docs-build"] }
assert_cmd = "2.2"
assert_fs = "1.1"
insta = { version = "1.49", features = ["filters"] }
predicates = "3.1"
proptest = { version = "1.11", default-features = false, features = ["std"] }
regex = "1.13.1"

[target.'cfg(windows)'.dev-dependencies]
portable-pty = "0.9.0"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.rustdoc]
# Doc comments must link to items that exist.
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
mod_module_files = "warn"
