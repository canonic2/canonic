[package]
name = "canonic-agent-kit"
version = "0.5.0"
edition = "2024"
rust-version = "1.102"
publish = false
license-file = "../../LICENSE"
description = "Owned native agent registration and configuration editing"

[dependencies]
canonic-tui-kit = { path = "../tui-kit", version = "0.5.0" }
clap = { version = "4.6", features = ["derive"] }
dirs = "7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
toml_edit = "0.25"
sha2 = "0.10"
thiserror = "2.0"
tempfile = "3.27"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["fs"] }

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
mod_module_files = "warn"

[profile.dev]
debug = false
