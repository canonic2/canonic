# Instant first page lab: the Rust preview host prototype. See ../README.md.
# Measurement code only; nothing outside this lab builds or names it.
[package]
name = "instant-first-page-host"
edition = "2024"
publish = false

# Outside every repository workspace.
[workspace]

[dependencies]
async-trait = "=0.1.89"
regex = "=1.13.1"
rspack = { version = "=0.102.7", features = ["loaders"] }
rspack_core = "=0.102.7"
rspack_tasks = "=0.102.7"
rspack_error = "=0.102.7"
rspack_fs = "=0.102.7"
rspack_hook = "=0.102.7"
rspack_paths = "=0.102.7"
rspack_regex = "=0.102.7"
rspack_resolver = "=0.102.7"
rspack_plugin_runtime_chunk = "=0.102.7"
rustc-hash = "=2.1.2"
rspack_plugin_entry = "=0.102.7"
rspack_plugin_hmr = "=0.102.7"
rspack_plugin_javascript = "=0.102.7"
rspack_plugin_lazy_compilation = "=0.102.7"
rspack_plugin_split_chunks = "=0.102.7"
rspack_watcher = "=0.102.7"
# rspack_hook's macros name it.
tracing = "=0.1.44"
tokio = { version = "=1.53.1", features = ["full"] }
# The page index. Versions match Rspack v2.2.7's own Cargo.lock, which this
# lab's lockfile starts from, so they add no second copy.
futures = "=0.3.32"
globset = "=0.4.16"
postcard = { version = "=1.1.3", features = ["alloc"] }
rayon = "=1.12.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
swc_common = "=26.0.0"
swc_ecma_ast = "=29.0.1"
swc_ecma_parser = "=45.1.3"

# A panic ends the host, so the runner sees a failure instead of a hang.
[profile.release]
panic = "abort"
