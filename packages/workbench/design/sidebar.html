<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sidebar</title>
  <link rel="stylesheet" href="/_workbench/ui/src/theme/defaults.css" />
  <link rel="stylesheet" href="../ui/legacy/page-list.css" />
  <link rel="stylesheet" href="../ui/src/app/sidebar/sidebar.css" />
  <link rel="stylesheet" href="design.css" />
</head>
<body>
  <!-- The sidebar as VS Code's Workbench view shows it: the space switcher,
       collection list, page list, and search, built by the same
       Web Components and page-list.js the extension ships, from a sample
       space. Scenarios: default, menu (the space switcher's menu open over the
       page list), filtered (a search typed). -->
  <wb-space-switcher id="spaces" allow-add allow-remove></wb-space-switcher>

  <div class="sb wb-browse">
    <section class="wb-browse-block" id="collectionsBlock" hidden>
      <h2 class="wb-browse-head">Collections</h2>
      <nav class="wb-collections" id="collections" aria-label="Collections"></nav>
    </section>
    <h2 class="wb-browse-head" id="collectionName"></h2>
    <nav class="wb-page-list" id="pageList" aria-label="Pages"></nav>
    <div class="wb-search">
      <span class="wb-search-icon" data-icon="search"></span>
      <input id="search" type="text" role="searchbox" placeholder="Search pages…" autocomplete="off"
             aria-label="Search pages and scenarios" />
    </div>
  </div>

  <script src="../ui/legacy/icons.js"></script>
  <script src="../ui/legacy/page-list.js"></script>
  <script src="spaces.js"></script>
  <script type="module">
    import Check from '../node_modules/lucide/dist/esm/icons/check.mjs';
    import ChevronDown from '../node_modules/lucide/dist/esm/icons/chevron-down.mjs';
    import ChevronsUpDown from '../node_modules/lucide/dist/esm/icons/chevrons-up-down.mjs';
    import CircleDot from '../node_modules/lucide/dist/esm/icons/circle-dot.mjs';
    import Component from '../node_modules/lucide/dist/esm/icons/component.mjs';
    import FileText from '../node_modules/lucide/dist/esm/icons/file-text.mjs';
    import Folder from '../node_modules/lucide/dist/esm/icons/folder.mjs';
    import Palette from '../node_modules/lucide/dist/esm/icons/palette.mjs';
    import Plus from '../node_modules/lucide/dist/esm/icons/plus.mjs';
    import Search from '../node_modules/lucide/dist/esm/icons/search.mjs';
    import X from '../node_modules/lucide/dist/esm/icons/x.mjs';
    import '/_workbench/ui/src/app/sidebar/sidebar.js';

    // Keep this authored HTML page as small as its displayed controls.
    window.lucide = { icons: {
      Check, ChevronDown, ChevronsUpDown, CircleDot, Component, FileText, Folder,
      Palette, Plus, Search, X,
    } };
    var scenario = new URLSearchParams(location.search).get('scenario') || 'default';
    Array.prototype.forEach.call(document.querySelectorAll('[data-icon]'), function (el) {
      el.appendChild(window.wbIcon(el.dataset.icon));
    });

    var shell = document.querySelector('.sb');
    var switcher = document.getElementById('spaces');
    switcher.iconRenderer = window.wbIcon;
    switcher.spaces = window.designSpaces.spaces;
    switcher.currentId = window.designSpaces.current;
    switcher.addEventListener('wb-space-toggle', function (e) { shell.classList.toggle('is-dimmed', e.detail.open); });

    var collections = [
      {
        name: 'Pages', icon: 'file-text', items: [
          { group: 'Auth', items: [
            { label: 'Sign in', src: 'pages/sign-in.html', scenarios: [
              { id: 'default', label: 'Default' }, { id: 'error', label: 'Wrong password' }, { id: 'loading', label: 'Signing in' },
            ] },
            { label: 'Reset password', src: 'pages/reset.html' },
          ] },
          { label: 'Dashboard', src: 'pages/dashboard.html', scenarios: [
            { id: 'default', label: 'Default' }, { id: 'empty', label: 'New workspace' },
          ] },
          { label: 'Projects', src: 'pages/projects.html' },
        ],
      },
      { name: 'Components', icon: 'component', items: [
        { label: 'Button', src: 'components/button.html' },
        { label: 'Card', src: 'components/card.html' },
      ] },
    ];
    var search = document.getElementById('search');
    /* As sidebar.js does: indexing gives each row its collection's glyph. */
    window.wbPageList.index(collections);
    var pageList = window.wbPageList.create({
      search: search,
      collectionList: document.getElementById('collections'),
      collectionsBlock: document.getElementById('collectionsBlock'),
      title: document.getElementById('collectionName'),
      list: document.getElementById('pageList'),
      collections: collections,
      treeKeyboard: true,
      onPick: function (src, picked) { pageList.setCurrent(src, picked, 'Pages'); },
    });
    pageList.reveal('pages/sign-in.html');
    pageList.setCurrent('pages/sign-in.html', null, 'Pages');

    if (scenario === 'menu') { switcher.open = true; shell.classList.add('is-dimmed'); }
    if (scenario === 'filtered') {
      search.value = 'sign';
      search.dispatchEvent(new Event('input', { bubbles: true }));
    }
  </script>
</body>
</html>
