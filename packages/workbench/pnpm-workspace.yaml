packages:
  - '.'

# One hoisted dependency tree serves the product's Node tools and hosts.
# VSIX staging copies the production closure into its distribution root.
nodeLinker: hoisted

# No dependency needs its install script: esbuild's and vsce-sign's platform
# binaries arrive as optional dependencies, keytar is only for vsce's own
# credential store, and packaging fetches Electron itself.
ignoredBuiltDependencies:
  - '@vscode/vsce-sign'
  - esbuild
  - keytar
