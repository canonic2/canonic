<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas Playground</title>
<link id="tokens" rel="stylesheet" href="/ui/src/app/workbench/workbench.css">
<link rel="stylesheet" href="/playground/playground.css">
</head>
<body>
<!-- Holds Workbench's real canvas tokens; the shell copies them to :root. -->
<div class="wb" id="token-source" hidden></div>

<main class="pg" id="playground">
  <div class="stage" id="stage">
    <canvas class="grid" id="grid" aria-hidden="true"></canvas>
    <div class="world" id="world"></div>
    <canvas class="overlay" id="overlay" aria-hidden="true"></canvas>
  </div>

  <header class="plate" aria-label="Playground">
    <span class="plate-mark" aria-hidden="true"></span>
    <span class="plate-kicker">Workbench</span>
    <span class="plate-title">Canvas Playground</span>
    <span class="plate-scene" id="scene-title">No scenario</span>
  </header>

  <section class="hud stats" aria-label="Frame statistics">
    <div class="stat"><span>FPS</span><b id="stat-fps">—</b></div>
    <div class="stat"><span>Frame</span><b id="stat-frame">—</b></div>
    <div class="stat"><span>Zoom</span><b id="stat-zoom">100%</b></div>
    <div class="stat"><span>DPR</span><b id="stat-dpr">—</b></div>
    <canvas class="spark" id="spark" width="120" height="28" aria-label="Frame time history"></canvas>
    <div class="host" id="host">Detecting host…</div>
  </section>

  <aside class="hud panel scenarios" id="scenarios-panel" aria-label="Scenarios">
    <div class="panel-head"><h2>Scenarios</h2><span class="count" id="scenario-count">0</span></div>
    <input class="search" id="search" type="search" placeholder="Filter scenarios" aria-label="Filter scenarios" spellcheck="false">
    <ol class="list" id="scenario-list"></ol>
    <div class="panel-foot"><kbd>[</kbd><kbd>]</kbd> switch <kbd>R</kbd> reload <kbd>Tab</kbd> panels</div>
  </aside>

  <aside class="hud panel inspector" id="inspector-panel" aria-label="Scenario inspector">
    <div class="panel-head"><h2>Inspector</h2><span class="status" id="scenario-status" data-state="idle">Idle</span></div>
    <p class="description" id="scenario-description">Pick a scenario to start.</p>
    <div class="controls" id="controls"></div>
    <h3>Readouts</h3>
    <dl class="readouts" id="readouts"></dl>
  </aside>

  <nav class="hud dock" aria-label="Camera">
    <button type="button" id="zoom-out" aria-label="Zoom out" title="Zoom out (⌘−)">−</button>
    <input type="range" id="zoom" min="-3" max="3" step="0.01" value="0" aria-label="Zoom">
    <button type="button" id="zoom-in" aria-label="Zoom in" title="Zoom in (⌘=)">+</button>
    <output id="zoom-label" for="zoom">100%</output>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" id="fit" title="Fit scenario (⇧1)">Fit</button>
    <button type="button" id="actual" title="Actual size (⌘0)">1:1</button>
    <button type="button" id="reload" title="Reload scenario (R)">Reload</button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <section class="error" id="error" role="alert" hidden>
    <header><b>Scenario error</b><button type="button" id="error-close" aria-label="Dismiss error">×</button></header>
    <pre id="error-text"></pre>
  </section>
</main>
<script type="module" src="/playground/shell.js"></script>
</body>
</html>
