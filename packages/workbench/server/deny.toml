[graph]
all-features = true

[advisories]
unmaintained = "workspace"

[licenses]
private = { ignore = true }
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]
confidence-threshold = 0.9

# SWC's stacker/psm build dependency writes platform archives.
[[licenses.exceptions]]
name = "ar_archive_writer"
allow = ["Apache-2.0 WITH LLVM-exception"]

# The file watcher and its Linux backend.
[[licenses.exceptions]]
name = "notify"
allow = ["CC0-1.0"]

[[licenses.exceptions]]
name = "inotify"
allow = ["ISC"]

[[licenses.exceptions]]
name = "inotify-sys"
allow = ["ISC"]

# The HTTP router's path matcher.
[[licenses.exceptions]]
name = "matchit"
allow = ["BSD-3-Clause"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
