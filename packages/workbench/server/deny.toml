[graph]
all-features = true

[advisories]
unmaintained = "workspace"

[licenses]
private = { ignore = true }
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]
confidence-threshold = 0.9

# SWC's stacker/psm build dependency writes platform archives.
[[licenses.exceptions]]
name = "ar_archive_writer"
allow = ["Apache-2.0 WITH LLVM-exception"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
