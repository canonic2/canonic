[graph]
all-features = true

[advisories]
unmaintained = "workspace"
# rkyv 0.7 is reached only through Lightning CSS's source-map crate, which
# archives maps it produced itself; the server never reads an archive from
# outside the process. 0.7 has no fixed release.
ignore = [{ id = "RUSTSEC-2026-0235", reason = "rkyv 0.7 via parcel_sourcemap never validates untrusted archives" }]

[licenses]
private = { ignore = true }
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]
confidence-threshold = 0.9

# SWC's stacker/psm build dependency writes platform archives.
[[licenses.exceptions]]
name = "ar_archive_writer"
allow = ["Apache-2.0 WITH LLVM-exception"]

# The file watcher and its Linux backend.
[[licenses.exceptions]]
name = "notify"
allow = ["CC0-1.0"]

[[licenses.exceptions]]
name = "inotify"
allow = ["ISC"]

[[licenses.exceptions]]
name = "inotify-sys"
allow = ["ISC"]

# The design export's PDF library reads text encodings with it.
[[licenses.exceptions]]
name = "encoding_rs"
allow = ["BSD-3-Clause"]

# The HTTP router's path matcher.
[[licenses.exceptions]]
name = "matchit"
allow = ["BSD-3-Clause"]

# Rspack's compiler crates and their dependencies, the same crates Rspack's
# published native binding is built from; each exception names one crate.
[[licenses.exceptions]]
name = "lightningcss"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "lightningcss-derive"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "cssparser"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "cssparser-color"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "cssparser-macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "dtoa-short"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "parcel_selectors"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "static-self"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "static-self-derive"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "smartstring"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "dragonbox_ecma"
allow = ["Apache-2.0 WITH LLVM-exception"]

[[licenses.exceptions]]
name = "foldhash"
allow = ["Zlib"]

[[licenses.exceptions]]
name = "foldhash-portable"
allow = ["Zlib"]

[[licenses.exceptions]]
name = "libz-rs-sys"
allow = ["Zlib"]

[[licenses.exceptions]]
name = "zlib-rs"
allow = ["Zlib"]

[[licenses.exceptions]]
name = "slotmap"
allow = ["Zlib"]

[[licenses.exceptions]]
name = "hmac-sha256"
allow = ["ISC"]

[[licenses.exceptions]]
name = "is_ci"
allow = ["ISC"]

[[licenses.exceptions]]
name = "libloading"
allow = ["ISC"]

[[licenses.exceptions]]
name = "Inflector"
allow = ["BSD-2-Clause"]

[[licenses.exceptions]]
name = "pnp"
allow = ["BSD-2-Clause"]

[[licenses.exceptions]]
name = "swc_sourcemap"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
name = "ustr-fxhash"
allow = ["BSD-2-Clause-Patent"]

[[licenses.exceptions]]
name = "xxhash-rust"
allow = ["BSL-1.0"]

# TLS for implementation proxies that reach https implementations.
[[licenses.exceptions]]
name = "ring"
allow = ["ISC"]

[[licenses.exceptions]]
name = "rustls-webpki"
allow = ["ISC"]

[[licenses.exceptions]]
name = "untrusted"
allow = ["ISC"]

[[licenses.exceptions]]
name = "subtle"
allow = ["BSD-3-Clause"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
