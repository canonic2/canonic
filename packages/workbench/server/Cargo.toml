[package]
name = "workbench-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license-file = "../LICENSE"
description = "Workbench server: one space's HTTP server, resident page index and preview compiler"

[dependencies]
anyhow = "=1.0.104"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
# Export job IDs and capture revisions come from the system's random source.
getrandom = "=0.3.2"
globset = "=0.4.16"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "tokio"] }
# The NFKD step when a size name becomes its key.
icu_normalizer = "=2.3.0"
ignore = "=0.4.23"
# The design export’s PDF joins the pages the capture helper prints.
lopdf = { version = "=0.42.0", default-features = false }
notify = { version = "=8.2.0", default-features = false, features = ["macos_fsevent"] }
postcard = { version = "=1.1.3", features = ["alloc"] }
rayon = "=1.12.0"
# Docs pages: Markdown, and highlighting with highlight.js class names.
pulldown-cmark = { version = "=0.13.4", default-features = false, features = ["html"] }
regex = "=1.13.1"
# Implementation proxies reach https implementations; local dev servers use
# self-signed certificates, which the proxies accept.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["preserve_order"] }
# Space ids, the same hash in every window and run.
sha1 = "=0.10.6"
sha2 = "=0.10.9"
swc_common = "=26.0.0"
swc_ecma_ast = "=29.0.1"
swc_ecma_parser = "=45.1.3"
swc_ecma_visit = "=29.0.0"
# Oniguruma avoids the high first-use regex compilation cost of fancy-regex.
# Syntect disables bindgen and uses onig's shipped bindings and bundled C engine.
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "regex-onig"] }
two-face = { version = "=0.4.5", default-features = false, features = ["syntect-onig"] }
# Origins parsed by the WHATWG URL rules the browser and capture helper follow.
url = "=2.5.8"
futures = { version = "=0.3.32", default-features = false, features = ["std"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "=1.53.3", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
# The preview compiler: Rspack's Rust crates, pinned exactly because their API
# does not follow semantic versioning. They build only on Rspack's nightly
# toolchain (`rust-toolchain.toml`), with its own lockfile versions.
async-trait = "=0.1.89"
base64 = "=0.22.1"
rspack = { version = "=0.102.7", features = ["loaders"] }
rspack_cacheable = "=0.102.7"
rspack_core = "=0.102.7"
rspack_error = "=0.102.7"
rspack_fs = "=0.102.7"
rspack_hook = "=0.102.7"
rspack_loader_runner = "=0.102.7"
rspack_paths = "=0.102.7"
rspack_plugin_entry = "=0.102.7"
rspack_plugin_externals = "=0.102.7"
rspack_plugin_hmr = "=0.102.7"
rspack_plugin_javascript = "=0.102.7"
rspack_plugin_runtime_chunk = "=0.102.7"
rspack_plugin_split_chunks = "=0.102.7"
rspack_regex = "=0.102.7"
rspack_resolver = "=0.102.7"
rspack_sources = "=0.102.7"
rspack_tasks = "=0.102.7"
rustc-hash = "=2.1.2"
# rspack_hook's macros name it.
tracing = "=0.1.44"

[dev-dependencies]
futures = { version = "=0.3.32", default-features = false, features = ["std", "executor"] }
assert_cmd = "2.2"
assert_fs = "1.1"
insta = { version = "1.49", features = ["filters", "json"] }
predicates = "3.1"
proptest = { version = "1.11", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
mod_module_files = "warn"

[profile.release]
strip = true

# Rspack and SWC compile previews far more slowly unoptimized, so the debug
# executable the tests run optimizes its dependencies; this crate stays fast
# to rebuild.
[profile.dev.package."*"]
opt-level = 2

# Without debug info, macOS builds keep no per-unit object files in deps/.
# Kept objects pile up with every edit, and a crowded deps/ slows every test
# process launch.
[profile.dev]
debug = false
