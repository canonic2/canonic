[package]
name = "workbench-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license-file = "../LICENSE"
description = "Workbench server: the front door to the Node server and the resident page index"

[dependencies]
anyhow = "=1.0.104"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
globset = "=0.4.16"
hyper = { version = "=1.12.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "tokio"] }
ignore = "=0.4.23"
notify = { version = "=8.2.0", default-features = false, features = ["macos_fsevent"] }
postcard = { version = "=1.1.3", features = ["alloc"] }
rayon = "=1.12.0"
regex = "=1.13.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["preserve_order"] }
swc_common = "=26.0.0"
swc_ecma_ast = "=29.0.1"
swc_ecma_parser = "=45.1.3"
tokio = { version = "=1.53.1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
assert_cmd = "2.2"
assert_fs = "1.1"
insta = { version = "1.49", features = ["filters", "json"] }
predicates = "3.1"
proptest = { version = "1.11", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
mod_module_files = "warn"

[profile.release]
strip = true
