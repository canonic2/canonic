[package]
name = "canonic-mcp-kit"
version = "0.16.0"
edition = "2024"
rust-version = "1.97"
publish = false
license-file = "LICENSE"
description = "Model Context Protocol server sessions, tool catalogs and a bounded stdio driver"

[dependencies]
iri-string = { version = "0.7.14", default-features = false, features = ["std"] }
jsonschema = { version = "0.60.2", default-features = false }
referencing = { version = "0.60.2", default-features = false }
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
getrandom = { version = "0.4.3", optional = true }
yaml-rust2 = { version = "0.13", default-features = false }

[features]
# The documentation bundle builder, for consumers' build scripts. It reads files,
# so ordinary runtime builds leave it out.
docs-build = []
# The blocking Streamable HTTP driver over std::net. It opens sockets and
# starts threads, so consumers that only use the exchange leave it out.
http-server = []
# The embedded OAuth 2.1 authorization server. It adds operating-system
# randomness for the codes and tokens it issues.
authorization-server = ["dep:getrandom"]

[dev-dependencies]
# Only the consumer example/fixtures generate IDs or persist task records.
getrandom = "0.4.3"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[[example]]
name = "http"
required-features = ["http-server"]

[[example]]
name = "authorization"
required-features = ["http-server"]

[[example]]
name = "authorization_server"
required-features = ["http-server", "authorization-server"]

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.rustdoc]
# Doc comments must link to items that exist.
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
mod_module_files = "warn"

# Without debug info, macOS builds keep no per-unit object files in deps/.
# Kept objects pile up with every edit, and a crowded deps/ slows every test
# process launch.
[profile.dev]
debug = false
