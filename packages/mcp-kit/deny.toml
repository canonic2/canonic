# Dependency checks for `cargo deny check`. See docs/contributing/development.md.

[graph]
all-features = true

[advisories]
# Unmaintained crates fail only when this package depends on them directly.
unmaintained = "workspace"

[licenses]
# This package's own license is proprietary; the unpublished package is not checked.
private = { ignore = true }
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]
confidence-threshold = 0.9

# yaml-rust2's hashlink tables use foldhash's permissive Zlib license,
# reviewed with the same scoped exception as Canonic TUI and Shield.
[[licenses.exceptions]]
name = "foldhash"
allow = ["Zlib"]

# referencing -> fluent-uri uses borrow-or-share. Its reviewed 0.2.4 MIT-0
# license permits unrestricted reuse/distribution without attribution, consistent
# with this package's permissive dependency policy. Keep approval crate-scoped.
[[licenses.exceptions]]
name = "borrow-or-share"
allow = ["MIT-0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
