[package]
name = "canonic-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license-file = "../../LICENSE"
description = "Reusable Canonic terminal components and local component gallery"

[features]
default = []
gallery = ["dep:clap", "dep:signal-hook"]

[[bin]]
name = "tui-gallery"
path = "src/main.rs"
required-features = ["gallery"]

[dependencies]
anyhow = "1.0"
# The polling backend preserves input readiness across macOS PTY resizes.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
unicode-width = "0.2"
unicode-segmentation = "1.13"
pulldown-cmark = { version = "0.13.4", default-features = false }
clap = { version = "4.5", features = ["derive"], optional = true }

[target.'cfg(unix)'.dependencies]
# Preserve the original terminal attributes across repeated editor handoffs.
rustix = { version = "1.1", features = ["termios", "process"] }
signal-hook = { version = "0.3", optional = true, default-features = false }

[dev-dependencies]
assert_cmd = "2.2"
assert_fs = "1.1"
insta = { version = "1.49", features = ["filters", "json"] }
predicates = "3.1"
proptest = { version = "1.11", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
mod_module_files = "warn"
