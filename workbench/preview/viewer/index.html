<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Workbench previews</title>
  <link rel="stylesheet" href="./viewer.css">
  <link rel="stylesheet" href="./preview-controls.css">
</head>
<body class="wb">
  <aside class="catalog">
    <h1 id="projectName">Workbench previews</h1>
    <label class="search">Find a preview<input id="search" type="search" placeholder="Search previews…"></label>
    <nav id="previews" aria-label="Previews"></nav>
    <details id="warnings" hidden><summary>Build warnings</summary><ul></ul></details>
  </aside>
  <main class="viewer">
    <header class="toolbar">
      <span id="previewTitle"></span>
      <label>State<select id="state" disabled></select></label>
      <label>Viewport<select id="viewport" disabled></select></label>
      <label class="dimensions" hidden>Width<input id="width" type="number" min="240" max="3840" value="960"></label>
      <label class="dimensions" hidden>Height<input id="height" type="number" min="240" max="3840" value="720"></label>
      <button id="reload" type="button" disabled>Reload</button>
      <button id="previewControls" type="button" hidden aria-expanded="false" aria-label="Preview controls">Preview controls</button>
      <a id="open" target="_blank" rel="noopener" hidden>Open preview ↗</a>
    </header>
    <p id="status" role="status" aria-live="polite">Loading previews…</p>
    <section id="canvas" aria-label="Preview canvas">
      <div id="stage"><iframe id="previewFrame" class="is-active" title="Preview"></iframe></div>
    </section>
  </main>
  <script src="./preview-controls.js"></script>
  <script src="./viewer.js"></script>
</body>
</html>
