<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Replaced with the space's name as soon as the config is read. -->
  <title>Workbench</title>
  <!-- The chrome brings its own values. Nothing here loads the project's
       tokens: the workbench is the tool, and it has to look the same in a
       project whose scale is named differently or not at all. The product's
       tokens live inside the frame, loaded by the pages themselves. -->
  <link rel="stylesheet" href="workbench.css" />
  <link rel="stylesheet" href="page-list.css" />
  <link rel="stylesheet" href="annotations.css" />
  <link rel="stylesheet" href="preview-controls.css" />
</head>
<body>
  <div class="wb" data-canvas-mode="default">
    <div class="wb-export-progress" id="exportProgress" role="status" aria-live="polite" hidden>
      <div class="wb-export-progress-card">
        <span class="wb-export-progress-icon" data-icon="archive"></span>
        <div class="wb-export-progress-copy">
          <strong>Preparing design-system export</strong>
          <span id="exportProgressText">Finding reference views…</span>
        </div>
        <progress id="exportProgressBar" value="0" max="1"></progress>
      </div>
    </div>
    <!-- Full-width top bar in three: where you are on the left, the lens
         centred on the bar, the size switcher and page actions on the right.
         The annotation tools float over the canvas in the toolbar instead,
         beside the thing they draw on. -->
    <header class="wb-topbar">
      <div class="wb-topbar-left">
        <!-- Which space, when the workbench has more than one: its mark and
             name, with the others one click away. Drawn by
             space-switcher.js from /_workbench/spaces. -->
        <span class="wb-space-crumb" id="spaceCrumb" hidden>
          <button class="wb-action wb-space-crumb-button" type="button" id="spaceCrumbButton"></button>
          <div class="wb-spaces-menu wb-space-crumb-menu" id="spaceCrumbMenu"></div>
          <span class="wb-crumb-sep" aria-hidden="true">/</span>
        </span>

        <!-- The page, then which of its states — or, under a Storybook
             lens, which of its stories — is showing, with the others one
             click away. Rows are built in workbench.js. -->
        <div class="wb-crumb" id="crumb" hidden>
          <span class="wb-crumb-page" id="crumbPage"></span>
          <span class="wb-states-control" id="stateControl" hidden>
            <span class="wb-crumb-sep" aria-hidden="true">/</span>
            <button class="wb-action wb-crumb-state" type="button" id="stateButton"
                    aria-haspopup="true" aria-expanded="false" title="Pick a state">
              <span id="stateName"></span>
              <span class="wb-crumb-caret" data-icon="chevron-down"></span>
            </button>
            <div class="wb-menu wb-menu-column" id="stateMenu" role="menu" aria-label="State" hidden></div>
          </span>
        </div>

        <!-- Off by default: clicking around a page you're reviewing
             shouldn't navigate you out of it. Turn it on to walk the real
             flow. Enforced inside the page by actions.js, which the server
             puts there — the shell can't reach into the frame off file://.

             A switch rather than a lit icon: this changes how the preview
             behaves, so its state has to be readable without hovering. -->
        <button class="wb-toggle" type="button" id="actionsToggle"
                role="switch" aria-checked="false"
                title="Actions — let links navigate and forms submit">
          <span data-icon="mouse-pointer-click"></span>
          <span class="wb-toggle-label">Actions</span>
          <span class="wb-toggle-track"><span class="wb-toggle-knob"></span></span>
        </button>
      </div>

      <!-- The lens: the design, or one of the page's implementations in
           its place. Only there when the page has one; Design is always
           first. Rows are built in workbench.js from the config. -->
      <div class="wb-topbar-center">
        <div class="wb-lenses" id="lenses" role="group" aria-label="Lens" hidden></div>
      </div>

      <!-- data-icon is filled in from icons.js; every icon-only
           control keeps a title and an aria-label so it still says what it
           does. -->
      <div class="wb-topbar-right">
        <div class="wb-sizes" role="group" aria-label="Size">
          <button class="wb-size" type="button" data-width="fit"
                  data-icon="minimize-2" title="Fit" aria-label="Fit"></button>
          <button class="wb-size" type="button" data-width="1512" data-height="982"
                  data-icon="monitor" title="Laptop · MacBook Pro 14, 1512 × 982"
                  aria-label="Laptop, MacBook Pro 14, 1512 by 982 points"></button>
          <button class="wb-size" type="button" data-width="393" data-height="852"
                  data-icon="smartphone" title="Mobile · iPhone 15 Pro, 393 × 852"
                  aria-label="Mobile, iPhone 15 Pro, 393 by 852 points"></button>
          <button class="wb-size" type="button" data-width="resizable"
                  data-icon="scaling" title="Resizable · drag an outside edge or corner"
                  aria-label="Resizable viewport"></button>
        </div>

        <button class="wb-action" type="button" id="reload"
                data-icon="rotate-cw" title="Reload" aria-label="Reload"></button>

        <!-- The page's source: the design file, and where each of its
             implementations keeps the code, as the extension resolves them
             on this machine. Hidden when nothing is serving that answer. -->
        <span class="wb-sources" id="sourceControl" hidden>
          <button class="wb-action" type="button" id="openSource"
                  data-icon="code" title="Open the source" aria-label="Open the source"
                  aria-haspopup="true" aria-expanded="false"></button>
          <div class="wb-menu wb-menu-column wb-menu-sources" id="sourceMenu" role="menu" aria-label="Source" hidden></div>
        </span>

        <button class="wb-action" type="button" id="copyReference"
                data-icon="copy" title="Copy reference" aria-label="Copy reference"></button>

        <a class="wb-action" id="open" target="_blank" rel="noopener"
           data-icon="external-link" title="Open on its own" aria-label="Open on its own"></a>

        <!-- Space-wide actions, and whatever the bar folds away when the
             editor is narrow. top-bar.js builds the menu; these two buttons
             are only ever reached through it. -->
        <button class="wb-action" type="button" id="previewControls" hidden
                data-icon="sliders-horizontal" title="Preview controls" aria-label="Preview controls"
                aria-expanded="false"></button>
        <span class="wb-topbar-overflow" id="topbarOverflow">
          <button class="wb-action" type="button" id="topbarOverflowButton"
                  data-icon="ellipsis" title="More" aria-label="More"
                  aria-haspopup="true" aria-expanded="false"></button>
          <div class="wb-menu wb-menu-column wb-topbar-overflow-menu" id="topbarOverflowMenu"
               role="menu" aria-label="More" hidden></div>
        </span>

        <button class="wb-action wb-in-menu" type="button" id="configureSpace" hidden
                data-icon="settings-2" title="Configure pages"
                aria-label="Configure pages"></button>

        <button class="wb-action wb-in-menu" type="button" id="exportSpace" hidden
                data-icon="archive" title="Download design-system ZIP"
                aria-label="Download design-system ZIP"></button>
      </div>
    </header>

    <!-- The space's pages, laid out like Sketch's sidebar: the collections
         on top, the chosen one's pages below, the filter at the bottom.
         Resizable. -->
    <aside class="wb-sidebar wb-browse">
      <header class="wb-sidebar-head" id="sidebarHead">
        <img class="wb-sidebar-mark" src="canonic.svg" alt="" width="16" height="16" />
        <h1 class="wb-space-name" id="spaceName"></h1>
      </header>

      <!-- In place of the header when there is more than one space. -->
      <div class="wb-spaces" id="spaces" hidden>
        <button class="wb-spaces-button" type="button" id="spaceButton"></button>
        <div class="wb-spaces-menu" id="spaceMenu"></div>
      </div>

      <section class="wb-browse-block" id="collectionsBlock" hidden>
        <h2 class="wb-browse-head">Collections</h2>
        <nav class="wb-collections" id="collections" aria-label="Collections"></nav>
      </section>

      <h2 class="wb-browse-head" id="collectionName"></h2>
      <nav class="wb-page-list" id="pageList" aria-label="Pages"></nav>

      <div class="wb-search">
        <span class="wb-search-icon" data-icon="search"></span>
        <input id="search" type="search" placeholder="Search pages…" autocomplete="off" aria-label="Search pages and states" />
      </div>

      <!-- Drag to resize, double-click to reset. -->
      <div class="wb-resizer" id="resizer" role="separator" aria-orientation="vertical"
           aria-label="Resize sidebar" tabindex="0"></div>
    </aside>

    <main class="wb-main">
      <div class="wb-canvas" id="canvas">
        <p class="wb-blank is-loading" id="blank" role="status">Loading pages…</p>
        <!-- The artboard's name and its real size, above it the way a design
             tool labels a frame. Unscaled: zoom.js places it. -->
        <div class="wb-artboard-label" id="artboardLabel" hidden>
          <span class="wb-artboard-name" id="artboardName"></span>
          <span class="wb-artboard-size" id="artboardSize" aria-live="polite"></span>
        </div>
        <!-- The artboard carries the viewport size and, in Resizable mode,
             puts 5px drag rails outside the preview instead of over its
             content. Its content box clips the preview frames. zoom.js scales
             and moves it as one piece. -->
        <div class="wb-artboard" id="artboard" hidden>
          <div class="wb-artboard-content" id="artboardContent">
            <!-- Frames stay attached while retained. Only the selected session
                 is visible; another frame prepares a new destination. -->
            <iframe class="is-active" id="frame" title="Preview" allow="clipboard-read; clipboard-write"></iframe>
            <iframe id="frameBuffer" title="Preview loading" aria-hidden="true" allow="clipboard-read; clipboard-write"></iframe>
            <div class="wb-preview-loading" role="status"><span>Loading preview…</span></div>
            <canvas class="wb-simulator" id="simulatorCanvas" aria-label="Interactive iOS Simulator" hidden></canvas>
            <div class="wb-simulator-prompt" id="simulatorPrompt" hidden>
              <button class="wb-simulator-share" id="shareSimulator" type="button">Retry native stream</button>
              <span id="simulatorStatus"></span>
            </div>
          </div>
          <!-- Annotations share the artboard's box but live outside its content
               clip, so a note can hang past the edge onto the canvas while the
               page stays clipped — and a focused note can never scroll the
               preview frame. Shapes go in the SVG; text boxes are siblings of
               it. Screenshots render the artboard, whose viewport crops to the
               same box the content clip uses. -->
          <div class="wb-annotation-layer" id="annotationLayer">
            <svg id="annotationSvg" aria-hidden="true">
              <defs>
                <!-- A plain triangle, 16px in user units rather than stroke
                     multiples: the weight never changes, so the head shouldn't
                     either. refX sits at the triangle's middle so the head
                     overshoots the line's end and buries its round cap where
                     the triangle is still wider than the stroke. -->
                <marker id="wb-arrowhead" markerWidth="16" markerHeight="11" refX="8" refY="5.5"
                        orient="auto" markerUnits="userSpaceOnUse">
                  <path d="M0,0 L16,5.5 L0,11 z" fill="currentColor" stroke="none" />
                </marker>
              </defs>
            </svg>
          </div>
          <span class="wb-artboard-resize wb-artboard-resize-left" data-resize="left"></span>
          <span class="wb-artboard-resize wb-artboard-resize-right" data-resize="right"></span>
          <span class="wb-artboard-resize wb-artboard-resize-bottom" data-resize="bottom"></span>
          <span class="wb-artboard-resize wb-artboard-resize-bottom-left" data-resize="bottom-left"></span>
          <span class="wb-artboard-resize wb-artboard-resize-bottom-right" data-resize="bottom-right"></span>
        </div>
      </div>

      <!-- The toolbar: annotation tools and the handoff float over the canvas
           they draw on. Select is the one way back to using the page itself. -->
      <div class="wb-toolbar" id="toolbar" role="toolbar" aria-label="Annotations and handoff">
        <div class="wb-annotation-tools" role="group" aria-label="Annotation tools">
          <button class="wb-action wb-tool" type="button" data-tool="pointer"
                  data-icon="mouse-pointer-2" title="Select · Esc" aria-label="Select"></button>
          <button class="wb-action wb-tool" type="button" data-tool="draw"
                  data-icon="pencil" title="Scribble" aria-label="Scribble"></button>

        <!-- Pointing at something is the most common annotation, so the arrow is a
             tool of its own rather than one of the shapes. -->
          <button class="wb-action wb-tool" type="button" data-tool="arrow"
                  data-icon="move-up-right" title="Arrow" aria-label="Arrow"></button>

        <!-- One shape button plus a caret: the button draws the shape it
             shows, the caret swaps which shape that is. The button's icon is
             set from annotations.js, so it carries no data-icon here. -->
          <span class="wb-shape">
            <button class="wb-action wb-tool" type="button" id="shapeTool" data-tool="rect"
                    title="Rectangle" aria-label="Rectangle"></button>
            <button class="wb-action wb-caret" type="button" id="shapeCaret"
                    data-icon="chevron-down" title="Pick a shape" aria-label="Pick a shape"
                    aria-haspopup="true" aria-expanded="false"></button>

            <div class="wb-menu" id="shapeMenu" role="menu" aria-label="Shape" hidden>
              <button class="wb-menu-item" type="button" role="menuitem" data-shape="line"
                      data-icon="minus" title="Line" aria-label="Line"></button>
              <button class="wb-menu-item" type="button" role="menuitem" data-shape="rect"
                      data-icon="square" title="Rectangle" aria-label="Rectangle"></button>
              <button class="wb-menu-item" type="button" role="menuitem" data-shape="ellipse"
                      data-icon="circle" title="Circle" aria-label="Circle"></button>
            </div>
          </span>

          <button class="wb-action wb-tool" type="button" data-tool="text"
                  data-icon="type" title="Text" aria-label="Text"></button>
          <button class="wb-action wb-tool" type="button" data-tool="comment"
                  data-icon="message-square" title="Comment" aria-label="Comment"></button>

          <span class="wb-sep"></span>

          <button class="wb-action" type="button" id="undo"
                  data-icon="undo-2" title="Undo · ⌘Z" aria-label="Undo last annotation"></button>
          <button class="wb-action" type="button" id="clearAnnotations"
                  data-icon="trash-2" title="Clear annotations" aria-label="Clear annotations"></button>
          <button class="wb-action" type="button" id="shoot"
                  data-icon="camera" title="Save screenshot" aria-label="Save screenshot"></button>
        </div>

        <!-- How many annotations the handoff will carry, then the handoff itself:
             the annotated screenshot saved, its prompt copied. The extension
             capability probe keeps the button out of standalone views. -->
        <span class="wb-annotation-count" id="annotationCount" hidden></span>
        <span class="wb-handoff-control" id="handoffControl" hidden>
          <button class="wb-handoff" type="button" id="handoff"
                  title="Copy handoff" aria-label="Copy handoff">
            <span data-icon="sparkles"></span>
            <span>Copy handoff</span>
          </button>
        </span>
      </div>

      <div class="wb-view-controls" id="viewControls" role="group" aria-label="View controls">
        <button class="wb-action" type="button" id="zoomCenter"
                data-icon="locate-fixed" title="Recenter view" aria-label="Recenter view"></button>
        <button class="wb-action" type="button" id="zoomOut"
                data-icon="minus" title="Zoom out · ⌘−" aria-label="Zoom out"></button>
        <button class="wb-zoom-value" type="button" id="zoomValue"
                title="Zoom options" aria-haspopup="true" aria-expanded="false">100%</button>
        <button class="wb-action" type="button" id="zoomIn"
                data-icon="plus" title="Zoom in · ⌘+" aria-label="Zoom in"></button>
        <div class="wb-menu wb-menu-column wb-zoom-menu" id="zoomMenu" role="menu" aria-label="Zoom" hidden></div>
      </div>
    </main>

    <dialog class="wb-config-dialog" id="configDialog" aria-labelledby="configTitle">
      <div class="wb-config-shell">
        <header class="wb-config-header">
          <div>
            <h2 id="configTitle">Configure pages</h2>
            <p>Edit collections, page paths, and the viewports each page supports.</p>
          </div>
          <button class="wb-action" type="button" id="configClose" data-icon="x"
                  title="Close" aria-label="Close configuration"></button>
        </header>
        <div class="wb-config-body" id="configBody"></div>
        <footer class="wb-config-footer">
          <span class="wb-config-status" id="configStatus" role="status" aria-live="polite"></span>
          <button class="wb-config-secondary" type="button" id="configAddCollection">Add collection</button>
          <button class="wb-config-primary" type="button" id="configSave">Save workbench.yaml</button>
        </footer>
      </div>
    </dialog>

    <p class="wb-toast" id="toast" role="status" aria-live="polite" hidden></p>
  </div>

  <!-- yaml and config before the shell, which asks them for the space it is
       showing and builds itself around the answer. -->
  <script src="modern-screenshot.js"></script>
  <script src="../node_modules/lucide/dist/umd/lucide.min.js"></script>
  <script src="icons.js"></script>
  <script src="yaml.js"></script>
  <script src="manifest.js"></script>
  <script src="config.js"></script>
  <script src="page-list.js"></script>
  <script src="keys.js"></script>
  <script src="address.js"></script>
  <script src="lenses.js"></script>
  <script src="simulator.js"></script>
  <script src="describe.js"></script>
  <script src="config-editor.js"></script>
  <script src="zoom.js"></script>
  <script src="space-switcher.js"></script>
  <script src="preview-sessions.js"></script>
  <script src="workbench.js"></script>
  <script src="capture-sync.js"></script>
  <script src="dom-mirror.js"></script>
  <script src="preview-bridge-client.js"></script>
  <script src="annotations.js"></script>
  <script src="reference.js"></script>
  <script src="agent-context.js"></script>
  <script src="top-bar.js"></script>
  <script src="preview-controls.js"></script>
  <!-- Docs pages: their canvas geometry, served from src/ with types stripped. -->
  <script type="module" src="src/docs/canvas/bootstrap.ts"></script>
  <script type="module" src="src/canvas/legacy-runtime.ts"></script>
</body>
</html>
