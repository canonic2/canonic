<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Screens</title>
  <!-- The Workbench extension inserts a <base>, the project root, and a content
       policy here: this document is loaded into a webview whose address is the
       editor's, so the base is the only thing that says where this folder
       actually is. Everything below is relative to it. -->
  <link rel="stylesheet" href="nav.css" />
  <link rel="stylesheet" href="sidebar.css" />
</head>
<body>
  <!-- Which project's screens these are, and the others to switch to. The
       extension lists the projects in a <meta name="canonic-projects">. -->
  <div class="wb-projects" id="projects" hidden>
    <button class="wb-projects-button" type="button" id="projectButton"></button>
    <div class="wb-projects-menu" id="projectMenu"></div>
  </div>

  <!-- The same list the workbench has, laid out like Sketch's sidebar: the
       sections on top, the chosen one's screens below, the filter at the
       bottom. -->
  <div class="sb wb-browse">
    <div class="sb-loading" id="loading" role="status" aria-live="polite">
      <span class="sb-loading-spinner" aria-hidden="true"></span>
      <span id="loadingText">Loading screens…</span>
    </div>
    <section class="wb-browse-block" id="sectionsBlock" hidden>
      <h2 class="wb-browse-head">Sections</h2>
      <nav class="wb-sections" id="sections" aria-label="Sections"></nav>
    </section>

    <h2 class="wb-browse-head" id="sectionName"></h2>
    <div class="sb-diagnostics" id="diagnostics" role="status" hidden></div>
    <nav class="wb-nav" id="nav" aria-label="Screens"></nav>

    <div class="wb-search">
      <span class="wb-search-icon" data-icon="search"></span>
      <input id="search" type="text" role="searchbox" placeholder="Search screens…" autocomplete="off"
             aria-label="Search screens and states" />
    </div>
  </div>

  <p class="sb-problem" id="problem" hidden></p>

  <script src="../node_modules/lucide/dist/umd/lucide.min.js"></script>
  <script src="icons.js"></script>
  <script src="yaml.js"></script>
  <script src="manifest.js"></script>
  <script src="config.js"></script>
  <script src="nav.js"></script>
  <script src="project-switcher.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
