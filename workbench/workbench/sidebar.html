<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pages</title>
  <!-- The Workbench extension inserts a <base>, the space root, and a content
       policy here: this document is loaded into a webview whose address is the
       editor's, so the base is the only thing that says where this folder
       actually is. Everything below is relative to it. -->
  <link rel="stylesheet" href="/_workbench/src/theme/defaults.css" />
  <link rel="stylesheet" href="page-list.css" />
  <link rel="stylesheet" href="sidebar.css" />
</head>
<body>
  <!-- Which space's pages these are, and the others to switch to. The
       extension lists the spaces in a <meta name="canonic-spaces">. -->
  <wb-space-switcher id="spaces" hidden></wb-space-switcher>

  <!-- The same list the workbench has, laid out like Sketch's sidebar: the
       collections on top, the chosen one's pages below, the filter at the
       bottom. -->
  <div class="sb wb-browse">
    <div class="sb-loading" id="loading" role="status" aria-live="polite">
      <span class="sb-loading-spinner" aria-hidden="true"></span>
      <span id="loadingText">Loading pages…</span>
    </div>
    <section class="wb-browse-block" id="collectionsBlock" hidden>
      <h2 class="wb-browse-head">Collections</h2>
      <nav class="wb-collections" id="collections" aria-label="Collections"></nav>
    </section>

    <h2 class="wb-browse-head" id="collectionName"></h2>
    <div class="sb-diagnostics" id="diagnostics" role="status" hidden></div>
    <nav class="wb-page-list" id="pageList" aria-label="Pages"></nav>

    <div class="wb-search">
      <span class="wb-search-icon" data-icon="search"></span>
      <input id="search" type="text" role="searchbox" placeholder="Search pages…" autocomplete="off"
             aria-label="Search pages and states" />
    </div>
  </div>

  <p class="sb-problem" id="problem" hidden></p>

  <script src="../node_modules/lucide/dist/umd/lucide.min.js"></script>
  <script src="icons.js"></script>
  <script src="yaml.js"></script>
  <script src="manifest.js"></script>
  <script src="config.js"></script>
  <script src="page-list.js"></script>
  <script type="module" src="/_workbench/src/components/bootstrap.ts"></script>
  <script src="sidebar.js"></script>
</body>
</html>
