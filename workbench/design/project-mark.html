<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project mark</title>
  <link rel="stylesheet" href="../workbench/nav.css" />
  <link rel="stylesheet" href="../workbench/sidebar.css" />
  <link rel="stylesheet" href="design.css" />
</head>
<body class="board">
  <h1>Project mark</h1>
  <p>Drawn by project-switcher.js from a project's name, <code>color</code>, and <code>icon</code>.</p>
  <div class="board-grid" id="marks"></div>

  <script src="../node_modules/lucide/dist/umd/lucide.min.js"></script>
  <script src="../workbench/icons.js"></script>
  <script src="../workbench/project-switcher.js"></script>
  <script>
    /* Every way a mark can be drawn. The image is the extension's own icon,
       inlined the way the server sends a project's image. */
    var image = 'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#fff" d="M12 4L19 4L19 29L44 29L44 36L12 36ZM22 12L36 12L36 26L29 26L29 19L22 19ZM4 12L9 12L9 19L4 19ZM29 39L36 39L36 44L29 44Z"/></svg>');
    var framed = 'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#111"/><path d="M8 24 16 7l8 17h-4.2L16 15.6 12.2 24z" fill="#ff5a36"/></svg>');
    var variants = [
      { label: 'blue', project: { initial: 'A', color: 'blue' } },
      { label: 'green', project: { initial: 'F', color: 'green' } },
      { label: 'orange', project: { initial: 'B', color: 'orange' } },
      { label: 'purple', project: { initial: 'D', color: 'purple' } },
      { label: 'pink', project: { initial: 'E', color: 'pink' } },
      { label: 'teal', project: { initial: 'M', color: 'teal' } },
      { label: 'red', project: { initial: 'R', color: 'red' } },
      { label: 'yellow', project: { initial: 'Y', color: 'yellow' } },
      { label: 'gray', project: { initial: 'G', color: 'gray' } },
      { label: '#2f7d55', project: { initial: 'H', color: '#2f7d55' } },
      { label: '#f5d76e (light)', project: { initial: 'L', color: '#f5d76e' } },
      { label: 'icon: palette', project: { icon: 'palette', color: 'purple' } },
      { label: 'icon on light hex', project: { icon: 'hammer', color: '#f5d76e' } },
      { label: 'image, no color', project: { image: framed } },
      { label: 'image on blue', project: { image: image, color: 'blue' } },
    ];
    var grid = document.getElementById('marks');
    variants.forEach(function (variant) {
      var cell = document.createElement('div');
      cell.className = 'board-cell';
      cell.appendChild(window.wbProjects.mark(variant.project));
      var label = document.createElement('span');
      label.textContent = variant.label;
      cell.appendChild(label);
      grid.appendChild(cell);
    });
  </script>
</body>
</html>
