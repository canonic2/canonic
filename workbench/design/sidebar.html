<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Workbench view</title>
  <link rel="stylesheet" href="../workbench/page-list.css" />
  <link rel="stylesheet" href="../workbench/sidebar.css" />
  <link rel="stylesheet" href="design.css" />
</head>
<body>
  <!-- VS Code's Workbench view: the space switcher over the page list,
       built by the same space-switcher.js and page-list.js the extension
       ships, from a sample space. States: default, menu (the space menu open
       over the list), filtered (a search typed). -->
  <div class="wb-spaces" id="spaces">
    <button class="wb-spaces-button" type="button" id="spaceButton"></button>
    <div class="wb-spaces-menu" id="spaceMenu"></div>
  </div>

  <div class="sb wb-browse">
    <section class="wb-browse-block" id="collectionsBlock" hidden>
      <h2 class="wb-browse-head">Collections</h2>
      <nav class="wb-collections" id="collections" aria-label="Collections"></nav>
    </section>
    <h2 class="wb-browse-head" id="collectionName"></h2>
    <nav class="wb-page-list" id="pageList" aria-label="Pages"></nav>
    <div class="wb-search">
      <span class="wb-search-icon" data-icon="search"></span>
      <input id="search" type="text" role="searchbox" placeholder="Search pages…" autocomplete="off"
             aria-label="Search pages and states" />
    </div>
  </div>

  <script src="../node_modules/lucide/dist/umd/lucide.min.js"></script>
  <script src="../workbench/icons.js"></script>
  <script src="../workbench/page-list.js"></script>
  <script src="../workbench/space-switcher.js"></script>
  <script src="spaces.js"></script>
  <script>
    var state = new URLSearchParams(location.search).get('state') || 'default';
    Array.prototype.forEach.call(document.querySelectorAll('[data-icon]'), function (el) {
      el.appendChild(window.wbIcon(el.dataset.icon));
    });

    var shell = document.querySelector('.sb');
    var switcher = window.wbSpaces.create({
      button: document.getElementById('spaceButton'),
      menu: document.getElementById('spaceMenu'),
      onPick: function () {},
      onAdd: function () {},
      onRemove: function () {},
      onToggle: function (open) { shell.classList.toggle('is-dimmed', open); },
    });
    switcher.set(window.designSpaces.spaces, window.designSpaces.current);

    var collections = [
      {
        name: 'Pages', icon: 'file-text', items: [
          { group: 'Auth', items: [
            { label: 'Sign in', src: 'pages/sign-in.html', states: [
              { id: 'default', label: 'Default' }, { id: 'error', label: 'Wrong password' }, { id: 'loading', label: 'Signing in' },
            ] },
            { label: 'Reset password', src: 'pages/reset.html' },
          ] },
          { label: 'Dashboard', src: 'pages/dashboard.html', states: [
            { id: 'default', label: 'Default' }, { id: 'empty', label: 'New workspace' },
          ] },
          { label: 'Projects', src: 'pages/projects.html' },
        ],
      },
      { name: 'Components', icon: 'component', items: [
        { label: 'Button', src: 'components/button.html' },
        { label: 'Card', src: 'components/card.html' },
      ] },
    ];
    var search = document.getElementById('search');
    /* As sidebar.js does: indexing gives each row its collection's glyph. */
    window.wbPageList.index(collections);
    var pageList = window.wbPageList.create({
      search: search,
      collectionList: document.getElementById('collections'),
      collectionsBlock: document.getElementById('collectionsBlock'),
      title: document.getElementById('collectionName'),
      list: document.getElementById('pageList'),
      collections: collections,
      treeKeyboard: true,
      onPick: function (src, picked) { pageList.setCurrent(src, picked, 'Pages'); },
    });
    pageList.reveal('pages/sign-in.html');
    pageList.setCurrent('pages/sign-in.html', null, 'Pages');

    if (state === 'menu') switcher.toggle(true);
    if (state === 'filtered') {
      search.value = 'sign';
      search.dispatchEvent(new Event('input', { bubbles: true }));
    }
  </script>
</body>
</html>
