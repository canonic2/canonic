<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Space switcher</title>
  <link rel="stylesheet" href="../workbench/page-list.css" />
  <link rel="stylesheet" href="../workbench/sidebar.css" />
  <link rel="stylesheet" href="design.css" />
</head>
<body>
  <!-- The switcher as the top of VS Code's Workbench view draws it.
       States: default (closed), open (the menu), hover (a removable row
       showing its remove button), single (one space). -->
  <div class="wb-spaces" id="spaces">
    <button class="wb-spaces-button" type="button" id="spaceButton"></button>
    <div class="wb-spaces-menu" id="spaceMenu"></div>
  </div>

  <script src="../node_modules/lucide/dist/umd/lucide.min.js"></script>
  <script src="../workbench/icons.js"></script>
  <script src="../workbench/space-switcher.js"></script>
  <script src="spaces.js"></script>
  <script>
    var state = new URLSearchParams(location.search).get('state') || 'default';
    var listed = window.designSpaces;
    var spaces = state === 'single' ? listed.spaces.slice(0, 1) : listed.spaces;
    var switcher = window.wbSpaces.create({
      button: document.getElementById('spaceButton'),
      menu: document.getElementById('spaceMenu'),
      onPick: function () {},
      onAdd: function () {},
      onRemove: function () {},
    });
    switcher.set(spaces, listed.current);
    if (state === 'open' || state === 'hover' || state === 'single') switcher.toggle(true);
    /* The hover state pins the remove button that :hover shows. */
    if (state === 'hover') {
      var row = document.querySelectorAll('.wb-spaces-row')[1];
      row.querySelector('.wb-spaces-remove').style.opacity = '1';
      row.querySelector('.wb-spaces-check').style.visibility = 'hidden';
      row.querySelector('.wb-spaces-item').style.background = 'var(--wb-hover)';
    }
  </script>
</body>
</html>
