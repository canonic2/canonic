name: Testrun release builds

on:
  workflow_dispatch:
    inputs:
      version:
        description: Testrun version in Cargo.toml and CHANGELOG.md
        required: true
        type: string
      commit:
        description: Full SHA of the prepared public main commit
        required: true
        type: string
      mode:
        description: Build release archives or render the website for a published release
        type: choice
        default: packages
        options: [packages, website]

permissions:
  contents: read

concurrency:
  group: testrun-release-${{ inputs.mode }}-${{ inputs.commit }}
  cancel-in-progress: false

jobs:
  build:
    if: inputs.mode == 'packages' && github.ref == 'refs/heads/main' && github.sha == inputs.commit
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: macos-15, target: aarch64-apple-darwin }
          - { runner: windows-2025, target: x86_64-pc-windows-msvc }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Test release packaging
        working-directory: packages/testrun/tools
        run: python -B -m unittest test_release_build
      - name: Build and verify package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
        shell: pwsh
        run: python -B packages/testrun/tools/release_build.py $env:RELEASE_VERSION $env:RELEASE_TARGET --output release-output
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testrun-${{ matrix.target }}
          path: release-output/*
          if-no-files-found: error
          compression-level: 0

  website:
    if: inputs.mode == 'website' && github.ref == 'refs/heads/main' && github.sha == inputs.commit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install and test the website
        working-directory: packages/website
        run: |
          npm exec --yes --package=pnpm@10.33.0 -- pnpm install --frozen-lockfile
          npm exec --yes --package=pnpm@10.33.0 -- pnpm test
      - name: Render the website for the verified release
        working-directory: packages/website
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TESTRUN_TAG: testrun/v${{ inputs.version }}
          SITE_ORIGIN: https://canonic.sh
          SITE_BASE: /
        run: npm exec --yes --package=pnpm@10.33.0 -- pnpm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonic-website
          path: packages/website/dist/
          if-no-files-found: error
