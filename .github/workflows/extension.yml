name: Build workbench extension

on:
  push:
    tags: ['workbench/v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - name: Check release version
        run: node -e 'const version = require("./workbench/package.json").version; if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.GITHUB_REF_NAME !== `workbench/v${version}`) { console.error(`Tag must be workbench/v${version}`); process.exit(1); }'
      - run: npm ci --ignore-scripts
        working-directory: workbench
      - run: npm test
        working-directory: workbench

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: win32-x64
            runner: windows-2025
          - target: win32-arm64
            runner: windows-11-arm
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: workbench
      - run: npm run package:all -- ${{ matrix.target }}
        working-directory: workbench
      - uses: actions/upload-artifact@v7
        with:
          name: workbench-${{ matrix.target }}
          path: workbench/dist/*.vsix
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: workbench-*
          merge-multiple: true
          path: dist
      - name: Publish six VSIX files to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#workbench/v}"
          files=(dist/*-"$version".vsix)
          test "${#files[@]}" -eq 6
          for file in "${files[@]}"; do
            name="${file##*/}"
            mv "$file" "dist/${name%-"$version".vsix}.vsix"
          done
          gh release create "$GITHUB_REF_NAME" dist/*.vsix --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --latest

  publish_website:
    needs: release
    uses: ./.github/workflows/website.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      workbench_tag: ${{ github.ref_name }}
