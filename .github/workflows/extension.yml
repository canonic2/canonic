name: Build workbench extension

on:
  push:
    tags: ['workbench/v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - name: Check release version
        run: node -e 'const version = require("./workbench/package.json").version; if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.GITHUB_REF_NAME !== `workbench/v${version}`) { console.error(`Tag must be workbench/v${version}`); process.exit(1); } if (require("./workbench/preview/package.json").version !== version) { console.error(`workbench/preview/package.json must be version ${version}`); process.exit(1); }'
      - name: Check release notes
        run: node workbench/scripts/release-notes.cjs "${GITHUB_REF_NAME#workbench/v}"
      - run: npm ci --ignore-scripts
        working-directory: workbench
      - run: npm test
        working-directory: workbench

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: win32-x64
            runner: windows-2025
          - target: win32-arm64
            runner: windows-11-arm
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: workbench
      - run: npm run package:all -- ${{ matrix.target }}
        working-directory: workbench
      - uses: actions/upload-artifact@v7
        with:
          name: workbench-${{ matrix.target }}
          path: workbench/dist/*.vsix
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: workbench-*
          merge-multiple: true
          path: dist
      # The CHANGELOG.md entry comes first; GitHub's generated notes add the
      # "Full Changelog" link the website turns into its changelog button.
      - name: Publish six VSIX files to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#workbench/v}"
          files=(dist/*-"$version".vsix)
          test "${#files[@]}" -eq 6
          for file in "${files[@]}"; do
            name="${file##*/}"
            mv "$file" "dist/${name%-"$version".vsix}.vsix"
          done
          node workbench/scripts/release-notes.cjs "$version" > release-notes.md
          # Compare with the workbench tag just below this one, not whichever
          # release GitHub would pick.
          previous="$(git tag -l 'workbench/v*' --sort=v:refname | awk -v tag="$GITHUB_REF_NAME" '$0 == tag { print last; exit } { last = $0 }')"
          start=()
          if [ -n "$previous" ]; then start=(--notes-start-tag "$previous"); fi
          gh release create "$GITHUB_REF_NAME" dist/*.vsix --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file release-notes.md --generate-notes "${start[@]}" --latest

  # The same six VSIX files on the Visual Studio Marketplace. vsce signs in
  # with a Microsoft Entra managed identity that trusts this repository's
  # `marketplace` environment, so no token is stored; Azure DevOps no longer
  # issues the global tokens the Marketplace accepts.
  publish_marketplace:
    needs: release
    runs-on: ubuntu-24.04
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
      - uses: actions/download-artifact@v8
        with:
          pattern: workbench-*
          merge-multiple: true
          path: dist
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # The identity needs no Azure roles, only Marketplace membership.
          allow-no-subscriptions: true
      # The ID to add as a Contributor member of the Marketplace publisher.
      # 499b84ac-… is Azure DevOps' fixed resource ID.
      - name: Show the identity's Marketplace ID
        run: az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv
      - name: Publish six VSIX files to the Marketplace
        run: |
          version="${GITHUB_REF_NAME#workbench/v}"
          files=(dist/*-"$version".vsix)
          test "${#files[@]}" -eq 6
          vsce="$(node -p 'require("./workbench/package.json").devDependencies["@vscode/vsce"]')"
          npx --yes "@vscode/vsce@$vsce" publish --azure-credential --packagePath "${files[@]}"

  # @canonic/workbench, the authoring types, at the extension's version. npm
  # trusts this workflow as the package's publisher, so no token is stored.
  publish_npm:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@11
      - run: npm publish --access public
        working-directory: workbench/preview

  publish_website:
    needs: release
    uses: ./.github/workflows/website.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      workbench_tag: ${{ github.ref_name }}
