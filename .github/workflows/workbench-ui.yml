name: Workbench UI quality

on:
  pull_request:
    paths: ['packages/workbench/**', '.github/workflows/workbench-ui.yml']
  push:
    branches: [main]
    paths: ['packages/workbench/**', '.github/workflows/workbench-ui.yml']

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: packages/workbench/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: packages/workbench/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: packages/workbench
      - run: pnpm run check:ui
        working-directory: packages/workbench
