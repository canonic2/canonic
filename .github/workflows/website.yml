name: Publish website

on:
  push:
    tags: ['website/v*']
  workflow_call:
    inputs:
      workbench_tag:
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Select website version
        id: website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/website/* ]]; then
            ref="$GITHUB_REF"
          else
            ref=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/website/v" --jq '.[].ref' | sort -V | tail -n 1)
            ref="${ref:-main}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.website.outputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Check website tag
        if: startsWith(github.ref, 'refs/tags/website/')
        run: node -e 'if (!/^website\/v\d+\.\d+\.\d+$/.test(process.env.GITHUB_REF_NAME)) { console.error("Tag must be website/v<major>.<minor>.<patch>"); process.exit(1); }'
      - uses: actions/configure-pages@v6
        id: pages
      - run: pnpm install --frozen-lockfile
        working-directory: website
      - run: pnpm test
        working-directory: website
      - name: Build the site
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKBENCH_TAG: ${{ inputs.workbench_tag }}
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: pnpm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
